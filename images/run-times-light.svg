<text x="776.0" y="222.0" font-size="14" font-weight="400" text-anchor="end" fill="#52514e">run 4 against the Gemini team</text>
<text x="24.0" y="508.0" font-size="12" font-weight="400" text-anchor="start" fill="#6f6d68">Gemini team: Faldor et al. (2026), arXiv 2610.22319, timed from its first program rather than first spawn.</text>
<text x="24.0" y="526.0" font-size="12" font-weight="400" text-anchor="start" fill="#6f6d68">The 4.0× puts run 4 on that clock too (6 h 50 min 39 s from its first program).</text>
