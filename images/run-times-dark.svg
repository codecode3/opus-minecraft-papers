<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' role="img" aria-labelledby="t d">
<title id="t">From 60 h 51 min to 6 h 51 min in four runs</title>
<desc id="d">Official time per run, from first spawn to the win. run 1: 60 h 51 min; run 2: 9 h 16 min; run 3: 10 h 58 min, ended without a win; run 4: 6 h 51 min. A team of four Gemini 4 Argon agents took 27 h 14 min.</desc>
<text x="24.0" y="38.0" font-size="22" font-weight="600" text-anchor="start" fill="#f0efec">From 60 h 51 min to 6 h 51 min in four runs</text>
<text x="24.0" y="64.0" font-size="14" font-weight="400" text-anchor="start" fill="#c3c2b7">Official time from first spawn to the Ender Dragon's death, 1 to 7 November 2026.</text>
<text x="24.0" y="84.0" font-size="14" font-weight="400" text-anchor="start" fill="#c3c2b7">Each Claude Opus 5.5 player inherited the files of the players before it.</text>
