<text x="24.0" y="508.0" font-size="12" font-weight="400" text-anchor="start" fill="#9a9890">Gemini team: Faldor et al. (2026), arXiv 2610.22319, timed from its first program rather than first spawn.</text>
<text x="24.0" y="526.0" font-size="12" font-weight="400" text-anchor="start" fill="#9a9890">The 5.8× puts run 5 on that clock too (4 h 39 min 41 s from its first program).</text>
