<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' role="img" aria-labelledby="t d">
<title id="t">Time to beat Minecraft, run by run</title>
<desc id="d">Official time per run, from first spawn to the win. run 1: 60 h 51 min; run 2: 9 h 16 min; run 3: 10 h 58 min, ended without a win; run 4: 6 h 51 min.</desc>
